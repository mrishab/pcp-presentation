<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PCP Undecidability - COMP382</title>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides/intro.md" data-separator="^---$" data-separator-vertical="^--$"></section>
      <section data-markdown="slides/pcp.md" data-separator="^---$" data-separator-vertical="^--$"></section>
      <section data-markdown="slides/proof.md" data-separator="^---$" data-separator-vertical="^--$"></section>
      <section data-markdown="slides/example.md" data-separator="^---$" data-separator-vertical="^--$"></section>
      <section data-markdown="slides/conclusion.md" data-separator="^---$" data-separator-vertical="^--$"></section>
    </div>
    <div class="author-footer" id="author-footer"></div>
  </div>

  <script type="module" src="/src/app.js"></script>

  <style>
    /* Base styles */
    .reveal h1,
    .reveal h2 {
      letter-spacing: 1px;
      text-transform: none;
    }

    .reveal h1 {
      font-size: 2.2em;
    }

    .reveal h2 {
      font-size: 1.6em;
    }

    .reveal ul,
    .reveal ol {
      font-size: 1.1em;
      line-height: 1.6;
    }

    .reveal section {
      text-align: center;
    }

    .reveal code {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: 'Fira Code', 'Monaco', monospace;
    }

    /* Subscript and superscript styling */
    .reveal sub {
      font-size: 0.7em;
      vertical-align: sub;
    }

    .reveal sup {
      font-size: 0.7em;
      vertical-align: super;
    }

    /* Domino box styling */
    .domino-box {
      display: inline-flex;
      flex-direction: column;
      border: 2px solid #58a6ff;
      border-radius: 8px;
      margin: 0.5em;
      min-width: 80px;
      background: rgba(88, 166, 255, 0.1);
      overflow: hidden;
    }

    .domino-box.large {
      min-width: 120px;
      font-size: 1.2em;
    }

    .domino-top {
      padding: 0.5em 1em;
      border-bottom: 2px solid #58a6ff;
      background: rgba(88, 166, 255, 0.15);
      font-family: 'Fira Code', monospace;
    }

    .domino-bottom {
      padding: 0.5em 1em;
      font-family: 'Fira Code', monospace;
    }

    .domino-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5em;
    }

    .domino-row.small .domino-box {
      min-width: 60px;
      font-size: 0.9em;
    }

    /* Math and definition boxes */
    .math-block {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      padding: 1em 1.5em;
      margin: 1em auto;
      max-width: 80%;
      font-family: 'Fira Code', monospace;
      font-size: 1.1em;
    }

    .definition-box {
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid #22c55e;
      border-radius: 8px;
      padding: 1em 1.5em;
      margin: 1em auto;
      max-width: 85%;
      text-align: left;
    }

    .theorem-box {
      background: rgba(251, 191, 36, 0.15);
      border: 2px solid #fbbf24;
      border-radius: 8px;
      padding: 1em 1.5em;
      margin: 1em auto;
      max-width: 85%;
    }

    .highlight-box {
      background: rgba(59, 130, 246, 0.2);
      border: 2px solid #3b82f6;
      border-radius: 8px;
      padding: 0.8em 1.2em;
      margin: 1em auto;
      max-width: 80%;
      font-weight: 600;
    }

    .example-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1em;
      margin: 1em auto;
      font-family: 'Fira Code', monospace;
      text-align: left;
      max-width: 60%;
    }

    .example-box div {
      margin: 0.3em 0;
    }

    /* Code block styling */
    .code-block {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1em 1.5em;
      margin: 1em auto;
      max-width: 80%;
      font-family: 'Fira Code', monospace;
      text-align: left;
      font-size: 0.95em;
    }

    /* Reduction chain styling */
    .reduction-chain {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
      margin: 1.5em 0;
      flex-wrap: wrap;
    }

    .reduction-chain.large {
      font-size: 1.3em;
    }

    .chain-node {
      background: rgba(99, 102, 241, 0.3);
      border: 2px solid #6366f1;
      border-radius: 8px;
      padding: 0.5em 1em;
      font-weight: 600;
    }

    .chain-node.undecidable {
      background: rgba(239, 68, 68, 0.3);
      border-color: #ef4444;
    }

    .chain-arrow {
      font-size: 1.2em;
      color: #94a3b8;
    }

    /* Configuration styling */
    .config-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 0.8em 1.5em;
      margin: 1em auto;
      font-family: 'Fira Code', monospace;
      display: inline-block;
    }

    .config-sequence {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3em;
      margin: 1em 0;
    }

    .config-sequence .config {
      font-family: 'Fira Code', monospace;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.4em 1em;
      border-radius: 4px;
    }

    .config-sequence .arrow {
      color: #94a3b8;
      font-size: 1.2em;
    }

    /* Match visualization */
    .match-visual {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1em;
      margin: 1em auto;
      max-width: 90%;
    }

    .match-visual.final {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    .match-row {
      display: flex;
      align-items: center;
      margin: 0.5em 0;
      font-family: 'Fira Code', monospace;
    }

    .match-label {
      width: 80px;
      text-align: right;
      margin-right: 1em;
      color: #94a3b8;
      font-weight: 600;
    }

    .match-content {
      flex: 1;
      text-align: left;
    }

    /* Transition visualization */
    .transition-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5em;
      margin: 1em 0;
      font-family: 'Fira Code', monospace;
    }

    .transition-visual .arrow {
      font-size: 1.5em;
      color: #94a3b8;
    }

    .transition-visual .before,
    .transition-visual .after {
      padding: 0.5em 1em;
    }

    .state {
      color: #fbbf24;
      font-weight: bold;
    }

    .tape-cell {
      padding: 0.1em 0.2em;
    }

    .tape-cell.highlight {
      background: rgba(251, 191, 36, 0.3);
      border-radius: 3px;
    }

    /* Transform box styling */
    .transform-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1em;
      margin: 1em auto;
      max-width: 80%;
    }

    .transform-row {
      display: flex;
      align-items: center;
      margin: 0.5em 0;
      font-family: 'Fira Code', monospace;
    }

    .transform-name {
      width: 60px;
      font-weight: bold;
      color: #58a6ff;
    }

    .transform-def {
      flex: 1;
    }

    /* Cleanup visualization */
    .cleanup-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3em;
      font-family: 'Fira Code', monospace;
      margin: 1em 0;
    }

    .cleanup-visual .arrow {
      color: #94a3b8;
    }

    /* Transition box */
    .transition-box {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      padding: 0.8em 1.5em;
      margin: 1em auto;
      font-family: 'Fira Code', monospace;
      display: inline-block;
    }

    /* Table styling */
    .reveal table {
      margin: 1em auto;
      border-collapse: collapse;
    }

    .reveal table th,
    .reveal table td {
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.5em 1em;
      text-align: left;
    }

    .reveal table th {
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    /* Fragment highlight colors */
    .reveal .highlight-red {
      color: #ef4444;
    }

    .reveal .highlight-green {
      color: #22c55e;
    }

    .reveal .highlight-blue {
      color: #3b82f6;
    }

    /* Cases styling for math */
    .cases {
      display: inline-block;
      text-align: left;
      border-left: 2px solid #94a3b8;
      padding-left: 1em;
      margin-left: 0.5em;
    }

    /* Author footer on every slide */
    .author-footer {
      position: fixed;
      bottom: 1em;
      left: 1.5em;
      font-size: 0.65em;
      color: rgba(255, 255, 255, 0.5);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.5px;
      z-index: 100;
      pointer-events: none;
    }

    /* Hide the author meta element in slides */
    .slide-author {
      display: none;
    }
  </style>
</body>

</html>
