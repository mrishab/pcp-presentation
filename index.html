<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>PCP Presentation</title>

  <link rel="stylesheet" href="dist/reset.css" />
  <link rel="stylesheet" href="dist/reveal.css" />
  <link rel="stylesheet" href="dist/theme/black.css" />
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides/intro.md"></section>
      <section data-markdown="slides/pcp.md"></section>
      <section data-markdown="slides/proof.md"></section>
      <section data-markdown="slides/example.md"></section>
      <section data-markdown="slides/conclusion.md"></section>
    </div>
  </div>

  <script src="dist/reveal.js"></script>
  <script src="dist/plugin/markdown.js"></script>
  <script src="dist/plugin/highlight.js"></script>
  <script src="dist/plugin/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });
  </script>
</body>
<style>
  .reveal h1, .reveal h2 {
    letter-spacing: 1px;
  }

  .reveal ul {
    font-size: 1.2em;
    line-height: 1.5;
  }

  .reveal section {
    text-align: center;
  }
</style>
</html>
